openapi: 3.1.0
info:
  title: Ledger — Transactions API
  version: "1.0.0"
  description: >
    Contrato canónico del módulo transactions (apps/ledger). Documento vivo: /sync
    reconcilia aquí el api.delta.yaml de cada historia (merge de paths/schemas +
    oasdiff). Introducido por hu-0003 (split del spec mixto accounts+transactions).
tags:
  - name: transactions
    description: Endpoints del agregado LedgerTransaction expuestos por apps/ledger.

paths:
  /transactions:
    post:
      tags: [transactions]
      operationId: recordTransaction
      summary: Record a transaction (pending or confirmed).
      parameters:
        - $ref: '../shared/api.yaml#/components/parameters/ExternalRefHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordTransactionRequest'
      responses:
        '201':
          description: Transaction recorded.
          headers:
            X-Ledger-Stream-Position:
              $ref: '../shared/api.yaml#/components/headers/LedgerStreamPosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '200':
          description: Replay idempotente del mismo external_ref.
        '400':
          description: >
            Menos de 2 postings — lo rechaza el ArrayMinSize(2) del DTO en el
            ValidationPipe, ANTES de llegar al agregado. El 422 INSUFFICIENT_POSTINGS
            (INV-2) que el dominio sabe emitir queda inalcanzable por esta ruta: por HTTP
            gana la malla de forma (hu-0014, AC-4).
        '401':
          description: Sin contexto autenticado (RF-26).
        '422':
          description: >
            UNBALANCED_TRANSACTION (INV-1, lo verifica el agregado), ACCOUNT_CLOSED
            (posting sobre cuenta cerrada — 422, no 409, por decisión de hu-0011),
            CURRENCY_NOT_ALLOWED, INVALID_MONEY o INVALID_LEDGER_DATE.
    get:
      tags: [transactions]
      operationId: listTransactions
      summary: List and filter transactions (RF-13).
      parameters:
        - name: account
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Only transactions touching this account.
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive start accounting date.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive end accounting date.
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - name: derivedKind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DerivedKind'
        - name: payee
          in: query
          required: false
          schema:
            type: string
        - name: clientId
          in: query
          required: false
          schema:
            type: string
          description: Filter by the client that recorded the transaction (RF-12).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: >
            Array crudo de filas de proyección, NO una página: no hay envoltorio con
            total/limit/offset. Sin `total`, el cliente detecta el fin cuando recibe menos
            filas que el `limit` pedido. El filtro `account` se aplica antes de paginar
            (hu-0014, AC-3).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '401':
          description: Sin contexto autenticado (RF-26).

  /transactions/{id}:
    get:
      tags: [transactions]
      operationId: getTransaction
      summary: Get a single transaction.
      description: >
        Devuelve la cabecera de la transacción SIN sus postings — las líneas viven en
        proj_postings y esta ruta no las cruza (hu-0014, AC-3).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: >
            Fila cruda de proyección sin postings, o `null` cuando la transacción no existe
            o pertenece a otro usuario. Esta ruta NO emite 404 TRANSACTION_NOT_FOUND: el
            handler devuelve `row ?? null`. El cliente debe chequear cuerpo nulo, no status.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Transaction'
                  - type: 'null'
        '401':
          description: Sin contexto autenticado (RF-26).

  /transactions/{id}/amend:
    post:
      tags: [transactions]
      operationId: amendTransaction
      summary: Amend a pending transaction (economic change, INV-6).
      description: >
        Reemplazo total: `postings` y `date` son REQUERIDOS. El agregado sustituye ambos
        wholesale (`amend(postings, date, balance)`), así que una enmienda parcial no tiene
        representación en el dominio y omitir cualquiera devuelve 400 (hu-0014, AC-2).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/api.yaml#/components/parameters/ExternalRefHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendTransactionRequest'
      responses:
        '200':
          description: Transaction amended.
          headers:
            X-Ledger-Stream-Position:
              $ref: '../shared/api.yaml#/components/headers/LedgerStreamPosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          description: Falta `postings` o `date`, o menos de 2 postings.
        '401':
          description: Sin contexto autenticado (RF-26).
        '404':
          description: TRANSACTION_NOT_FOUND.
        '409':
          description: IMMUTABLE_TRANSACTION — la transacción ya está CONFIRMED (INV-6).
        '422':
          description: UNBALANCED_TRANSACTION, ACCOUNT_CLOSED, CURRENCY_NOT_ALLOWED o INVALID_LEDGER_DATE.

  /transactions/{id}/annotate:
    post:
      tags: [transactions]
      operationId: annotateTransaction
      summary: Annotate a transaction (non-economic, any non-voided state).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotateTransactionRequest'
      responses:
        '200':
          description: Transaction annotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '409':
          description: Transaction is VOIDED (INV-6).

  /transactions/{id}/confirm:
    post:
      tags: [transactions]
      operationId: confirmTransaction
      summary: Confirm a pending transaction.
      description: >
        EL BODY SE IGNORA POR COMPLETO. El controller declara `_dto` y despacha
        `new ConfirmTransactionCommand(id)`: el `postings?` del schema no se transporta.
        Confirmar con postings distintos a los registrados no está soportado — la vía es
        `amend` mientras sigue PENDING, y después `confirm` (hu-0014, AC-2).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/api.yaml#/components/parameters/ExternalRefHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTransactionRequest'
      responses:
        '200':
          description: Transaction confirmed.
          headers:
            X-Ledger-Stream-Position:
              $ref: '../shared/api.yaml#/components/headers/LedgerStreamPosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '401':
          description: Sin contexto autenticado (RF-26).
        '404':
          description: TRANSACTION_NOT_FOUND.
        '409':
          description: INVALID_TRANSACTION_STATE — la transacción no está PENDING.

  /transactions/{id}/void:
    post:
      tags: [transactions]
      operationId: voidTransaction
      summary: Void a pending transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidTransactionRequest'
      responses:
        '200':
          description: Transaction voided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '409':
          description: Transaction not in PENDING state (AC-7).

  /transactions/{id}/reverse:
    post:
      tags: [transactions]
      operationId: reverseTransaction
      summary: Reverse a confirmed transaction; returns the reversal id (§7.3).
      description: >
        Crea una transacción de reversa (T2) con los postings invertidos y
        `metadata.reverses_id = {id}`; la original NO se muta. EL `reason?` DEL BODY SE
        IGNORA: el controller declara `_dto` y despacha
        `new ReverseConfirmedTransactionCommand(id)`, así que a diferencia de `void` el
        motivo no se persiste. El campo se conserva en el contrato para no romper clientes
        (hu-0014, AC-2).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/api.yaml#/components/parameters/ExternalRefHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseTransactionRequest'
      responses:
        '201':
          description: >
            Reversa emitida. El `id` del cuerpo es el de la TRANSACCIÓN DE REVERSA (T2),
            no el de la original.
          headers:
            X-Ledger-Stream-Position:
              $ref: '../shared/api.yaml#/components/headers/LedgerStreamPosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '401':
          description: Sin contexto autenticado (RF-26).
        '404':
          description: TRANSACTION_NOT_FOUND.
        '409':
          description: INVALID_TRANSACTION_STATE — la transacción no está CONFIRMED.

components:
  schemas:
    # --- Shared (copiado en cada spec de módulo para que sea autocontenido) ---
    CommandAccepted:
      type: object
      required: [id, streamPosition]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the affected aggregate.
        streamPosition:
          type: string
          description: Global stream position for read-your-writes (RNF-9), as a decimal string.

    # --- LedgerTransaction ---
    TransactionStatus:
      type: string
      enum: [PENDING, CONFIRMED, VOIDED]

    DerivedKind:
      type: string
      enum: [EXPENSE, INCOME, TRANSFER, COMPOUND]

    Posting:
      type: object
      required: [accountId, amount, currency]
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          type: string
          example: "-31900"
          description: Exact decimal string; positive debits, negative credits.
        currency:
          type: string
          example: COP
        metadata:
          type: object
          description: Free-form per-posting metadata.

    RecordTransactionRequest:
      type: object
      required: [date, description, status, postings]
      properties:
        date:
          type: string
          format: date
          example: "2026-07-20"
          description: Plain accounting date (RNF-7).
        payee:
          type: string
          example: Netflix
        description:
          type: string
          example: Monthly subscription
        status:
          $ref: '#/components/schemas/TransactionStatus'
          description: PENDING or CONFIRMED (VOIDED is never a creation target).
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
          minItems: 2
        invoiceUrl:
          type: string
          format: url
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object

    AmendTransactionRequest:
      type: object
      properties:
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
          minItems: 2
        date:
          type: string
          format: date
          example: "2026-07-20"
          description: Plain accounting date (RNF-7).

    AnnotateTransactionRequest:
      type: object
      properties:
        payee:
          type: string
          example: Netflix
        description:
          type: string
          example: Corrected description
        invoiceUrl:
          type: string
          format: url
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object

    ConfirmTransactionRequest:
      type: object
      properties:
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
          minItems: 2
          description: Final postings; omit to confirm as-is.

    VoidTransactionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          example: Duplicated capture

    ReverseTransactionRequest:
      type: object
      properties:
        reason:
          type: string
          example: Refunded by the merchant

    TransactionPosting:
      type: object
      required: [accountId, amount, currency]
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          type: string
          example: "-31900"
          description: Exact decimal string (INV-8).
        currency:
          type: string
          example: COP

    Transaction:
      type: object
      required: [id, date, description, status, derivedKind, postings]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          example: "2026-07-20"
        payee:
          type: string
          example: Netflix
        description:
          type: string
          example: Monthly subscription
        status:
          $ref: '#/components/schemas/TransactionStatus'
        derivedKind:
          $ref: '#/components/schemas/DerivedKind'
          description: Projector-derived classification (RF-4).
        postings:
          type: array
          items:
            $ref: '#/components/schemas/TransactionPosting'
        tags:
          type: array
          items:
            type: string

    TransactionList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        total:
          type: integer
          description: Total rows matching the filters, ignoring pagination.
        limit:
          type: integer
          description: Page size that was applied.
        offset:
          type: integer
          description: Row offset that was applied.
