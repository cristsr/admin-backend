openapi: 3.1.0
info:
  title: Ledger — Accounts API
  version: "1.0.0"
  description: >
    Contrato canónico del módulo accounts (apps/ledger). Documento vivo: /sync
    reconcilia aquí el api.delta.yaml de cada historia (merge de paths/schemas +
    oasdiff). Introducido por hu-0003 (split del spec mixto accounts+transactions).
tags:
  - name: accounts
    description: Endpoints del agregado Account expuestos por apps/ledger.
  - name: ledger
    description: >
      Ciclo de vida a nivel ledger (LedgerController): inicialización y lectura de
      settings. Documentado aquí por cercanía — el efecto observable de inicializar es
      la aparición de las cuentas técnicas de sistema.

# NOTA DE CONTRATO (hu-0013). Las cuatro lecturas de este documento devuelven la fila
# de la proyección tal cual, en snake_case (account_id, currency_code, confirmed_amount,
# pending_amount, presentation_currency). Los schemas Account / AccountTree /
# AccountBalance / LedgerSettings describen la forma *pretendida* y decoran Swagger vía
# @ApiOkResponse, pero no se construyen en runtime: el controller hace
# queryBus.ask<AccountDto>(...), un genérico sin verificación que no transforma nada.
# Unificarlos (mapper explícito o proyecciones en camelCase) es trabajo de otra HU.

paths:
  /ledger/initialize:
    post:
      tags: [ledger]
      operationId: initializeLedger
      summary: Initialize the ledger (creates the technical system accounts).
      parameters:
        - $ref: '../shared/api.yaml#/components/parameters/ExternalRefHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeLedgerRequest'
      responses:
        '201':
          description: Ledger initialized; system accounts created.
          headers:
            X-Ledger-Stream-Position:
              $ref: '../shared/api.yaml#/components/headers/LedgerStreamPosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '200':
          description: Replay idempotente del mismo external_ref.
        '401':
          description: Sin contexto autenticado (RF-26).
        '409':
          description: LEDGER_ALREADY_INITIALIZED.
        '422':
          description: INVALID_CURRENCY_CODE o INVALID_TIME_ZONE.

  /ledger/settings:
    get:
      tags: [ledger]
      operationId: getLedgerSettings
      summary: Read the ledger settings projection.
      responses:
        '200':
          description: >
            Fila cruda de la proyección de settings (snake_case), o `null` si el ledger
            no fue inicializado. No emite 422 LEDGER_NOT_INITIALIZED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerSettings'
        '401':
          description: Sin contexto autenticado (RF-26).

  /accounts:
    post:
      tags: [accounts]
      operationId: openAccount
      summary: Open an account.
      description: >
        `type` y `parentId` se validan como forma pero NO se transportan al command: el
        agregado los deriva del nombre jerárquico (`Assets:Bancolombia:Savings` → tipo
        ASSETS, padre `Assets:Bancolombia`). Un `type` que contradiga el prefijo del
        nombre se ignora en silencio (hu-0013, AC-3).
      parameters:
        - $ref: '../shared/api.yaml#/components/parameters/ExternalRefHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '201':
          description: Account opened successfully.
          headers:
            X-Ledger-Stream-Position:
              $ref: '../shared/api.yaml#/components/headers/LedgerStreamPosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '200':
          description: Replay idempotente del mismo external_ref.
        '401':
          description: Sin contexto autenticado (RF-26).
        '409':
          description: NAME_COLLISION — el nombre jerárquico ya existe para el usuario.
        '422':
          description: >
            REAL_ACCOUNT_SINGLE_CURRENCY (cuenta real con ≠1 moneda, AC-2),
            INVALID_ACCOUNT_NAME, INVALID_LEDGER_DATE o UNKNOWN_CURRENCY.
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: List the accounts (flat list).
      description: >
        `?view=tree|flat` se valida pero SE IGNORA: la respuesta es siempre la lista plana
        ordenada por nombre. El shaping jerárquico está pendiente (TODO(read-shape) en
        account-tree-view.ts). El cliente puede reconstruir el árbol desde el nombre, que
        codifica la ruta completa (hu-0013, AC-4).
      parameters:
        - name: view
          in: query
          required: false
          description: Aceptado por compatibilidad de contrato; sin efecto hoy.
          schema:
            $ref: '#/components/schemas/AccountTreeView'
      responses:
        '200':
          description: Lista plana de filas crudas de proyección, ordenadas por name ASC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTree'
        '401':
          description: Sin contexto autenticado (RF-26).

  /accounts/{id}:
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Get a single account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: >
            Fila cruda de proyección, o `null` cuando la cuenta no existe o pertenece a
            otro usuario. Esta ruta NO emite 404 ACCOUNT_NOT_FOUND: el handler hace
            `row ?? null` y ninguna capa lo traduce a excepción. El cliente debe chequear
            cuerpo nulo, no status (hu-0013, AC-4).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Account'
                  - type: 'null'
        '401':
          description: Sin contexto autenticado (RF-26).

  /accounts/{id}/balance:
    get:
      tags: [accounts]
      operationId: getAccountBalances
      summary: Account balances (confirmed and pending per currency).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: currency
          in: query
          required: false
          schema:
            type: string
            example: COP
          description: >
            SE IGNORA. Aceptado y validado por AccountBalanceQueryDto, pero el controller
            no lo transporta al query bus: la respuesta siempre trae todas las monedas de
            la cuenta. Filtrar queda del lado del cliente (hu-0013, AC-5).
      responses:
        '200':
          description: >
            Filas crudas de proyección (snake_case). Array vacío si la cuenta no existe o
            pertenece a otro usuario — es filtro, no error. El balance nunca se escribe
            (INV-5).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountBalance'
        '401':
          description: Sin contexto autenticado (RF-26).

  /accounts/{id}/rename:
    post:
      tags: [accounts]
      operationId: renameAccount
      summary: Rename an account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameAccountRequest'
      responses:
        '200':
          description: Account renamed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '409':
          description: Root type immutable (INV-14) or system account protected (INV-13).

  /accounts/{id}/close:
    post:
      tags: [accounts]
      operationId: closeAccount
      summary: Close an account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseAccountRequest'
      responses:
        '200':
          description: Account closed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '409':
          description: System account protected (INV-13).

components:
  schemas:
    # --- Shared (copiado en cada spec de módulo para que sea autocontenido) ---
    CommandAccepted:
      type: object
      required: [id, streamPosition]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the affected aggregate.
        streamPosition:
          type: string
          description: Global stream position for read-your-writes (RNF-9), as a decimal string.

    # --- Account ---
    AccountType:
      type: string
      enum: [ASSETS, LIABILITIES, INCOME, EXPENSES, EQUITY]

    OpenAccountRequest:
      type: object
      required: [type, name, currencies, openedOn, isBankMirror]
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        name:
          type: string
          example: Assets:Bancolombia:Savings
          description: Hierarchical account name.
        parentId:
          type: string
          format: uuid
          description: Parent node; omitted for a root account.
        currencies:
          type: array
          items:
            type: string
          example: [COP]
          minItems: 1
        openedOn:
          type: string
          format: date
          example: "2026-07-20"
          description: Plain accounting date, no timezone (RNF-7).
        isBankMirror:
          type: boolean
          description: True when this account mirrors a real bank account or wallet.

    RenameAccountRequest:
      type: object
      required: [newName]
      properties:
        newName:
          type: string
          example: Assets:Bancolombia:Checking

    CloseAccountRequest:
      type: object
      required: [closedOn]
      properties:
        closedOn:
          type: string
          format: date
          example: "2026-07-20"
          description: Plain accounting date the account closes on (RNF-7).

    AccountTreeView:
      type: string
      enum: [tree, flat]

    Account:
      type: object
      required: [id, type, name, currencies, isClosed, isSystem]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AccountType'
        name:
          type: string
          example: Assets:Bancolombia:Savings
        parentId:
          type: string
          format: uuid
        currencies:
          type: array
          items:
            type: string
          example: [COP]
        isClosed:
          type: boolean
          description: True once the account has been closed.
        isSystem:
          type: boolean
          description: True for technical system accounts that cannot be closed (INV-13).

    AccountTree:
      type: object
      required: [view, accounts]
      properties:
        view:
          $ref: '#/components/schemas/AccountTreeView'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'

    AccountBalance:
      type: object
      description: >
        Fila cruda de `proj_balances` tal como la devuelve el handler (hu-0013, AC-10).
        Los nombres son los de la proyección, en snake_case.
      required: [account_id, currency_code, confirmed_amount, pending_amount]
      properties:
        account_id:
          type: string
          format: uuid
        currency_code:
          type: string
          example: COP
        confirmed_amount:
          type: string
          example: "125000"
          description: Balance from confirmed transactions, as a decimal string (INV-8).
        pending_amount:
          type: string
          example: "-31900"
          description: Delta from still-pending transactions, as a decimal string (INV-8).

    InitializeLedgerRequest:
      type: object
      description: Body de `POST /ledger/initialize`. Valida solo forma.
      required: [presentationCurrency, timezone]
      properties:
        presentationCurrency:
          type: string
          example: COP
          description: Moneda de presentación del ledger (ISO 4217).
        timezone:
          type: string
          example: America/Bogota
          description: Timezone IANA usada para derivar límites de día (RNF-7).

    LedgerSettings:
      type: object
      description: >
        Fila cruda de la proyección de settings (hu-0013, AC-10). La respuesta es `null`
        cuando el ledger no fue inicializado.
      required: [user_id, presentation_currency, timezone]
      properties:
        user_id:
          type: string
        presentation_currency:
          type: string
          example: COP
        timezone:
          type: string
          example: America/Bogota
