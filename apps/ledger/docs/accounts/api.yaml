openapi: 3.1.0
info:
  title: hu-0003 API
  version: "1.0.0"
  description: "hu-0003: Agregados Account y LedgerTransaction — ciclo de vida contable completo."
tags:
  - name: accounts
    description: Endpoints del agregado Account expuestos por apps/ledger
  - name: transactions
    description: Endpoints del agregado LedgerTransaction expuestos por apps/ledger

paths:
  /accounts:
    post:
      tags: [accounts]
      operationId: openAccount
      summary: Open an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '201':
          description: Account opened successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '422':
          description: Real account with more than one currency rejected (AC-2).
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: List the account tree.
      parameters:
        - name: view
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountTreeView'
      responses:
        '200':
          description: Account tree returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTree'

  /accounts/{id}:
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Get a single account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Account not found.

  /accounts/{id}/balance:
    get:
      tags: [accounts]
      operationId: getAccountBalances
      summary: Account balances (confirmed and pending per currency).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: currency
          in: query
          required: false
          schema:
            type: string
            example: COP
          description: Restrict to a single currency; omit for all.
      responses:
        '200':
          description: Balances returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountBalance'

  /accounts/{id}/rename:
    post:
      tags: [accounts]
      operationId: renameAccount
      summary: Rename an account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameAccountRequest'
      responses:
        '200':
          description: Account renamed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '409':
          description: Root type immutable (INV-14) or system account protected (INV-13).

  /accounts/{id}/close:
    post:
      tags: [accounts]
      operationId: closeAccount
      summary: Close an account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseAccountRequest'
      responses:
        '200':
          description: Account closed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '409':
          description: System account protected (INV-13).

  /transactions:
    post:
      tags: [transactions]
      operationId: recordTransaction
      summary: Record a transaction (pending or confirmed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordTransactionRequest'
      responses:
        '201':
          description: Transaction recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '422':
          description: Fewer than 2 postings (INV-2) or unbalanced (INV-1).
    get:
      tags: [transactions]
      operationId: listTransactions
      summary: List and filter transactions (RF-13).
      parameters:
        - name: account
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Only transactions touching this account.
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive start accounting date.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive end accounting date.
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - name: derivedKind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DerivedKind'
        - name: payee
          in: query
          required: false
          schema:
            type: string
        - name: clientId
          in: query
          required: false
          schema:
            type: string
          description: Filter by the client that recorded the transaction (RF-12).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Transaction list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'

  /transactions/{id}:
    get:
      tags: [transactions]
      operationId: getTransaction
      summary: Get a single transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: Transaction not found.

  /transactions/{id}/amend:
    post:
      tags: [transactions]
      operationId: amendTransaction
      summary: Amend a pending transaction (economic change, INV-6).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendTransactionRequest'
      responses:
        '200':
          description: Transaction amended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '409':
          description: Transaction not in PENDING state (INV-6).

  /transactions/{id}/annotate:
    post:
      tags: [transactions]
      operationId: annotateTransaction
      summary: Annotate a transaction (non-economic, any non-voided state).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotateTransactionRequest'
      responses:
        '200':
          description: Transaction annotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '409':
          description: Transaction is VOIDED (INV-6).

  /transactions/{id}/confirm:
    post:
      tags: [transactions]
      operationId: confirmTransaction
      summary: Confirm a pending transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTransactionRequest'
      responses:
        '200':
          description: Transaction confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '409':
          description: Transaction not in PENDING state (AC-7).

  /transactions/{id}/void:
    post:
      tags: [transactions]
      operationId: voidTransaction
      summary: Void a pending transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidTransactionRequest'
      responses:
        '200':
          description: Transaction voided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '409':
          description: Transaction not in PENDING state (AC-7).

  /transactions/{id}/reverse:
    post:
      tags: [transactions]
      operationId: reverseTransaction
      summary: Reverse a confirmed transaction; returns the reversal id (§7.3).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseTransactionRequest'
      responses:
        '201':
          description: Reversal issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '409':
          description: Transaction not in CONFIRMED state (AC-7).

components:
  schemas:
    # --- Shared ---
    CommandAccepted:
      type: object
      required: [id, streamPosition]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the affected aggregate.
        streamPosition:
          type: string
          description: Global stream position for read-your-writes (RNF-9), as a decimal string.

    # --- Account ---
    AccountType:
      type: string
      enum: [ASSETS, LIABILITIES, INCOME, EXPENSES, EQUITY]

    OpenAccountRequest:
      type: object
      required: [type, name, currencies, openedOn, isBankMirror]
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        name:
          type: string
          example: Assets:Bancolombia:Savings
          description: Hierarchical account name.
        parentId:
          type: string
          format: uuid
          description: Parent node; omitted for a root account.
        currencies:
          type: array
          items:
            type: string
          example: [COP]
          minItems: 1
        openedOn:
          type: string
          format: date
          example: "2026-07-20"
          description: Plain accounting date, no timezone (RNF-7).
        isBankMirror:
          type: boolean
          description: True when this account mirrors a real bank account or wallet.

    RenameAccountRequest:
      type: object
      required: [newName]
      properties:
        newName:
          type: string
          example: Assets:Bancolombia:Checking

    CloseAccountRequest:
      type: object
      required: [closedOn]
      properties:
        closedOn:
          type: string
          format: date
          example: "2026-07-20"
          description: Plain accounting date the account closes on (RNF-7).

    AccountTreeView:
      type: string
      enum: [tree, flat]

    Account:
      type: object
      required: [id, type, name, currencies, isClosed, isSystem]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AccountType'
        name:
          type: string
          example: Assets:Bancolombia:Savings
        parentId:
          type: string
          format: uuid
        currencies:
          type: array
          items:
            type: string
          example: [COP]
        isClosed:
          type: boolean
          description: True once the account has been closed.
        isSystem:
          type: boolean
          description: True for technical system accounts that cannot be closed (INV-13).

    AccountTree:
      type: object
      required: [view, accounts]
      properties:
        view:
          $ref: '#/components/schemas/AccountTreeView'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'

    AccountBalance:
      type: object
      required: [currency, confirmed, pending]
      properties:
        currency:
          type: string
          example: COP
        confirmed:
          type: string
          example: "125000"
          description: Balance from confirmed transactions.
        pending:
          type: string
          example: "-31900"
          description: Delta from still-pending transactions.

    # --- LedgerTransaction ---
    TransactionStatus:
      type: string
      enum: [PENDING, CONFIRMED, VOIDED]

    DerivedKind:
      type: string
      enum: [EXPENSE, INCOME, TRANSFER, COMPOUND]

    Posting:
      type: object
      required: [accountId, amount, currency]
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          type: string
          example: "-31900"
          description: Exact decimal string; positive debits, negative credits.
        currency:
          type: string
          example: COP
        metadata:
          type: object
          description: Free-form per-posting metadata.

    RecordTransactionRequest:
      type: object
      required: [date, description, status, postings]
      properties:
        date:
          type: string
          format: date
          example: "2026-07-20"
          description: Plain accounting date (RNF-7).
        payee:
          type: string
          example: Netflix
        description:
          type: string
          example: Monthly subscription
        status:
          $ref: '#/components/schemas/TransactionStatus'
          description: PENDING or CONFIRMED (VOIDED is never a creation target).
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
          minItems: 2
        invoiceUrl:
          type: string
          format: url
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object

    AmendTransactionRequest:
      type: object
      properties:
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
          minItems: 2
        date:
          type: string
          format: date
          example: "2026-07-20"
          description: Plain accounting date (RNF-7).

    AnnotateTransactionRequest:
      type: object
      properties:
        payee:
          type: string
          example: Netflix
        description:
          type: string
          example: Corrected description
        invoiceUrl:
          type: string
          format: url
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object

    ConfirmTransactionRequest:
      type: object
      properties:
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
          minItems: 2
          description: Final postings; omit to confirm as-is.

    VoidTransactionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          example: Duplicated capture

    ReverseTransactionRequest:
      type: object
      properties:
        reason:
          type: string
          example: Refunded by the merchant

    TransactionPosting:
      type: object
      required: [accountId, amount, currency]
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          type: string
          example: "-31900"
          description: Exact decimal string (INV-8).
        currency:
          type: string
          example: COP

    Transaction:
      type: object
      required: [id, date, description, status, derivedKind, postings]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          example: "2026-07-20"
        payee:
          type: string
          example: Netflix
        description:
          type: string
          example: Monthly subscription
        status:
          $ref: '#/components/schemas/TransactionStatus'
        derivedKind:
          $ref: '#/components/schemas/DerivedKind'
          description: Projector-derived classification (RF-4).
        postings:
          type: array
          items:
            $ref: '#/components/schemas/TransactionPosting'
        tags:
          type: array
          items:
            type: string

    TransactionList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        total:
          type: integer
          description: Total rows matching the filters, ignoring pagination.
        limit:
          type: integer
          description: Page size that was applied.
        offset:
          type: integer
          description: Row offset that was applied.
