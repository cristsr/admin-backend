name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: finances
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create users database
        run: |
          PGPASSWORD=admin psql -h localhost -U postgres -c "CREATE DATABASE users;"

      # exchanges/gateway are excluded: exchanges has a pre-existing unrelated
      # broken import (../env), gateway no longer exists.
      - name: Build finances
        run: npx nx build finances

      - name: Build users
        run: npx nx build users

      - name: Run finances migrations against a fresh database
        env:
          DB_URI: postgres://postgres:admin@localhost:5432/finances
        run: |
          TS_NODE_PROJECT=apps/finances/tsconfig.app.json \
          NODE_OPTIONS="-r tsconfig-paths/register" \
          npx typeorm-ts-node-commonjs migration:run -d apps/finances/src/database/data-source.ts

      - name: Run users migrations against a fresh database
        run: |
          TS_NODE_PROJECT=apps/users/tsconfig.app.json \
          NODE_OPTIONS="-r tsconfig-paths/register" \
          npx typeorm-ts-node-commonjs migration:run -d apps/users/src/config/database/data-source.ts
        env:
          DB_URI: postgres://postgres:admin@localhost:5432/users

      # users/gateway have a pre-existing, unrelated jest moduleNameMapper
      # issue (tracked separately) — only finances' suite is green today.
      - name: Test finances
        run: npx nx test finances
