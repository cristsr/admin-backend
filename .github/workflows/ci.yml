name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: finances
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # `finances` is now the single monolith: it owns the users and exchanges
      # tables, so one build/migration/test pass covers everything.
      - name: Build finances
        run: npx nx build finances

      - name: Run finances migrations against a fresh database
        env:
          DB_URI: postgres://postgres:admin@localhost:5432/finances
        run: |
          TS_NODE_PROJECT=apps/finances/tsconfig.app.json \
          NODE_OPTIONS="-r tsconfig-paths/register" \
          npx typeorm-ts-node-commonjs migration:run -d apps/finances/src/database/data-source.ts

      - name: Test finances
        run: npx nx test finances
