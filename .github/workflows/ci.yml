name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: finances
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One workspace, two apps: `run-many` covers both without duplicating
      # steps. No `nx affected`, so the checkout needs no full history.
      - name: Lint workspace
        run: npx nx run-many -t lint --projects=finances,ledger,shared

      - name: Build apps
        run: npx nx run-many -t build --projects=finances,ledger

      - name: Run finances migrations against a fresh database
        env:
          DB_URI: postgres://postgres:admin@localhost:5432/finances
        run: |
          TS_NODE_PROJECT=apps/finances/tsconfig.app.json \
          NODE_OPTIONS="-r tsconfig-paths/register" \
          npx typeorm-ts-node-commonjs migration:run -d apps/finances/src/database/data-source.ts

      # The ledger event store lives in its own database on the same instance.
      - name: Create the ledger database
        run: PGPASSWORD=admin psql -h localhost -U postgres -d finances -c 'CREATE DATABASE ledger;'

      # Wired from EP-0.5 so the event store schema (EP-1.5) applies on every
      # run; passes with zero migrations until then.
      - name: Run ledger migrations against a fresh database
        env:
          DB_URI: postgres://postgres:admin@localhost:5432/ledger
        run: |
          TS_NODE_PROJECT=apps/ledger/tsconfig.app.json \
          NODE_OPTIONS="-r tsconfig-paths/register" \
          npx typeorm-ts-node-commonjs migration:run -d apps/ledger/src/database/data-source.ts

      - name: Test workspace
        run: npx nx run-many -t test --projects=finances,ledger,shared

  # AC-6 (sm-0004): auth happy path against a real Keycloak, using the same
  # realm import committed under docker/keycloak/import.
  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: finances
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      keycloak:
        image: quay.io/keycloak/keycloak:24.0
        env:
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
        ports:
          - 8080:8080
        options: >-
          --name keycloak
          --volume ${{ github.workspace }}/docker/keycloak/import:/opt/keycloak/data/import

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/realms/finances/.well-known/openid-configuration >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs keycloak || true
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Run finances migrations against a fresh database
        env:
          DB_URI: postgres://postgres:admin@localhost:5432/finances
        run: |
          TS_NODE_PROJECT=apps/finances/tsconfig.app.json \
          NODE_OPTIONS="-r tsconfig-paths/register" \
          npx typeorm-ts-node-commonjs migration:run -d apps/finances/src/database/data-source.ts

      - name: Run e2e auth tests
        env:
          ENV: test
          PORT: 3000
          DB_TYPE: postgres
          DB_URI: postgres://postgres:admin@localhost:5432/finances
          DB_SSL: 'false'
          DB_SYNCHRONIZE: 'false'
          SHOW_DOCS: 'false'
          OIDC_ISSUER: http://localhost:8080/realms/finances
          OIDC_AUDIENCE: finances-api
          AUTH_IDENTITY_PROVIDER: keycloak
          WEBHOOK_API_KEY: test-key
          EXCHANGE_RATES_URL: http://localhost:8080
          KEYCLOAK_TOKEN_URL: http://localhost:8080/realms/finances/protocol/openid-connect/token
          KEYCLOAK_CLIENT_ID: finances-test
          KEYCLOAK_USER: test-user
          KEYCLOAK_PASSWORD: test-pass
        run: npx jest --config apps/finances/test/jest-e2e.config.ts
