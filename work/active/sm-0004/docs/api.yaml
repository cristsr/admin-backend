openapi: 3.1.0
info:
  title: sm-0004 API
  version: '1.0.0'
  description: >
    Contrato generado por /design para sm-0004: calidad de plataforma no-funcional.
    Endpoints HTTP nuevos: health checks (liveness/readiness). Además define los
    esquemas de seguridad que el contrato OpenAPI publicado (AC-1) debe declarar para
    todos los endpoints, y la respuesta 429 del rate limiting (AC-5). El contrato
    completo de todos los endpoints se genera desde el código con @nestjs/swagger;
    aquí se fija el diseño de lo que la historia agrega/cambia.
tags:
  - name: finances-health
    description: Health checks de la app finances (liveness / readiness). Públicos, sin JWT.

paths:
  /health/live:
    get:
      tags: [finances-health]
      operationId: healthLive
      summary: Liveness — el proceso está vivo, sin tocar dependencias externas.
      security: []
      responses:
        '200':
          description: El proceso está vivo y aceptando requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResult'

  /health/ready:
    get:
      tags: [finances-health]
      operationId: healthReady
      summary: Readiness — el proceso y sus dependencias (DB, OIDC) están listos.
      security: []
      responses:
        '200':
          description: Base de datos y proveedor OIDC accesibles; el servicio puede recibir tráfico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResult'
        '503':
          description: >
            Al menos una dependencia no está lista (DB caída o proveedor OIDC sin
            responder); el orquestador debe sacar la instancia del balanceo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResult'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de usuario validado contra el proveedor OIDC. Aplica a los endpoints privados.
    webhookApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: API key propia del webhook (sistema, no usuario). Aplica solo a /webhooks/*.

  responses:
    TooManyRequests:
      description: >
        Se superó el límite de tasa (AC-5). Auth 5/min, webhook 60/min. El conteo es
        por IP real (X-Forwarded-For detrás de NGINX); el webhook además por API key.
      headers:
        Retry-After:
          description: Segundos hasta que la ventana se reinicia.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ThrottledError'

  schemas:
    HealthCheckResult:
      type: object
      description: >
        Resultado estándar de @nestjs/terminus. `status` es "ok" en 200 y "error" en 503.
        `info` lista las dependencias sanas, `error` las caídas, `details` la unión de ambas.
      required: [status, info, error, details]
      properties:
        status:
          type: string
          enum: [ok, error]
        info:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicatorStatus'
          description: Dependencias en estado "up" (vacío en liveness).
        error:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicatorStatus'
          description: Dependencias en estado "down".
        details:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicatorStatus'
          description: Estado de todas las dependencias evaluadas (db, oidc).

    HealthIndicatorStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        message:
          type: string
          description: Detalle opcional del fallo cuando status es "down".

    ThrottledError:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          enum: [429]
        message:
          type: string
          description: Mensaje de límite excedido (ThrottlerException).
        error:
          type: string
          enum: [Too Many Requests]

# Nota de aplicación de seguridad (AC-1), no endpoints nuevos — se declara en el código:
#   - Endpoints privados (accounts, categories POST/DELETE, movements, transfers, budgets,
#     scheduled, summary): security: [{ bearerAuth: [] }]
#   - GET /categories/taxonomy: security: []  (público)
#   - POST /webhooks/*: security: [{ webhookApiKey: [] }], y responden 429 (ver TooManyRequests)
#   - Endpoints de auth: responden 429 (ver TooManyRequests)
