openapi: 3.1.0
info:
  title: sm-0001 API
  version: "1.0.0"
  description: >
    Contrato generado por /design para sm-0001: Cerrar huecos de features a medias.
    Cubre la superficie HTTP nueva o modificada. AC-1 (notificación de umbral de
    presupuesto) es un flujo de mensajería asíncrona sobre PostgreSQL (PGMQ), no un
    endpoint HTTP — se documenta en docs/diagram.md y design.md, no aquí.
tags:
  - name: finances
    description: Endpoints expuestos por el microservicio finances

paths:
  /accounts/{id}/balance:
    get:
      tags: [finances]
      operationId: getAccountBalance
      summary: Saldo vivo de una cuenta (initialBalance + movimientos)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Saldo actual de la cuenta en su propia moneda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountBalanceResponse' }
        '404':
          description: Cuenta inexistente o perteneciente a otro usuario

  /accounts:
    get:
      tags: [finances]
      operationId: listAccounts
      summary: Lista de cuentas del usuario, cada una con su saldo vivo embebido
      responses:
        '200':
          description: Cuentas del usuario autenticado con su saldo calculado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountOutput' }

  /movements/{id}:
    patch:
      tags: [finances]
      operationId: patchMovement
      summary: Edita campos de un movimiento sin alterar tipo ni transferencias
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementPatchRequest' }
      responses:
        '200':
          description: Movimiento actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementOutput' }
        '404':
          description: Movimiento inexistente o perteneciente a otro usuario
        '422':
          description: >
            Edición no permitida: se intentó cambiar el tipo, editar una pata de
            transferencia (TRANSFER_IN/TRANSFER_OUT), o modificar un dato de ingesta
            (merchant/amount/date/factura) en un movimiento con source=WEBHOOK

  /scheduled/{id}:
    patch:
      tags: [finances]
      operationId: patchScheduled
      summary: Edita un movimiento programado; solo afecta ocurrencias futuras
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledPatchRequest' }
      responses:
        '200':
          description: Programado actualizado; los movimientos ya materializados no se tocan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledOutput' }
        '404':
          description: Programado inexistente o perteneciente a otro usuario
        '422':
          description: Edición no permitida (p. ej. intento de cambiar el tipo)

  /transfers:
    post:
      tags: [finances]
      operationId: createTransfer
      summary: Transfiere entre cuentas propias; permite distinta moneda con conversión
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInput' }
      responses:
        '201':
          description: Transferencia registrada como par de movimientos enlazados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOutput' }
        '400':
          description: Cuenta origen y destino son la misma
        '404':
          description: Cuenta origen o destino inexistente o de otro usuario
        '422':
          description: >
            Transferencia cross-currency sin tasa histórica disponible para la fecha
            (ni siquiera una anterior por carry-forward)

  /transfers/{transferGroup}/reversal:
    post:
      tags: [finances]
      operationId: reverseTransfer
      summary: Anula una transferencia mediante reversa compensatoria
      parameters:
        - name: transferGroup
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Reversa creada como par compensatorio; el original se conserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferReversalResponse' }
        '404':
          description: transferGroup inexistente o perteneciente a otro usuario
        '409':
          description: La transferencia ya fue anulada previamente

  /webhooks/transactions/{externalReference}/reversal:
    post:
      tags: [finances]
      operationId: reverseWebhookTransaction
      summary: Revierte un movimiento de webhook mal reconciliado (movimiento compensatorio)
      description: Autenticado con la API key del webhook, no con JWT de usuario. Idempotente.
      parameters:
        - name: externalReference
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >
            Reversa aplicada (o ya existente: idempotente por externalReference).
            Devuelve el movimiento compensatorio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementReversalResponse' }
        '401':
          description: API key del webhook ausente o inválida
        '404':
          description: No existe un movimiento con ese externalReference

  /summary/balance:
    get:
      tags: [finances]
      operationId: getConsolidatedBalance
      summary: Balance consolidado del usuario en su moneda de presentación
      description: >
        Consolida las cuentas del usuario convirtiendo las de otra moneda a la moneda
        de presentación (claim presentationCurrency del JWT), con tasas históricas.
      parameters:
        - name: startDate
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: endDate
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Balance consolidado más el desglose por cuenta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsolidatedBalanceResponse' }

components:
  schemas:

    MovementType:
      type: string
      enum: [INCOME, EXPENSE, TRANSFER_IN, TRANSFER_OUT]

    PaymentMethod:
      type: string
      enum: [CASH, DEBIT, CREDIT, TRANSFER, OTHER]

    MovementSource:
      type: string
      enum: [MANUAL, WEBHOOK, SCHEDULED]

    Frequency:
      type: string
      enum: [ONCE, DAILY, WEEKLY, MONTHLY, YEARLY]

    AccountOutput:
      type: object
      description: Cuenta con su saldo vivo embebido (AC-3)
      required: [id, name, initialBalance, currency, balance, user]
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        initialBalance: { type: number }
        currency: { type: string }
        balance:
          type: number
          description: initialBalance + suma de movimientos (INCOME/TRANSFER_IN suman, EXPENSE/TRANSFER_OUT restan)
        user: { type: integer }

    AccountBalanceResponse:
      type: object
      required: [accountId, balance, currency]
      properties:
        accountId: { type: integer }
        balance:
          type: number
          description: Saldo vivo en la moneda de la cuenta
        currency: { type: string }

    MovementCategorySummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        icon: { type: string }
        color: { type: string }

    MovementSubcategorySummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    MovementAccountSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        initialBalance: { type: number }

    MovementPatchRequest:
      type: object
      description: >
        Todos los campos opcionales (PATCH parcial). No incluye type (inmutable) ni
        permite editar patas de transferencia. En movimientos source=WEBHOOK solo se
        aceptan notes, category, subcategory y paymentMethod.
      properties:
        date: { type: string, format: date-time }
        category: { type: integer, description: id de la categoría }
        subcategory: { type: integer, description: id de la subcategoría (debe pertenecer a category) }
        amount: { type: number, minimum: 0 }
        description: { type: string }
        notes: { type: string }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }

    MovementOutput:
      type: object
      required: [id, date, type, description, amount, currency, source, user]
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        date: { type: string, format: date-time }
        type: { $ref: '#/components/schemas/MovementType' }
        description: { type: string }
        merchant: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        amount: { type: number }
        currency: { type: string }
        paymentMethod:
          allOf: [{ $ref: '#/components/schemas/PaymentMethod' }]
          nullable: true
        source: { $ref: '#/components/schemas/MovementSource' }
        transferGroup: { type: string, format: uuid, nullable: true }
        invoiceNumber: { type: string, nullable: true }
        invoiceIssuer: { type: string, nullable: true }
        invoiceUrl: { type: string, nullable: true }
        invoiceIssuedAt: { type: string, format: date-time, nullable: true }
        category:
          allOf: [{ $ref: '#/components/schemas/MovementCategorySummary' }]
          nullable: true
        subcategory:
          allOf: [{ $ref: '#/components/schemas/MovementSubcategorySummary' }]
          nullable: true
        account:
          allOf: [{ $ref: '#/components/schemas/MovementAccountSummary' }]
          nullable: true
        user: { type: integer }

    ScheduledPatchRequest:
      type: object
      description: >
        Todos los campos opcionales. No incluye type (inmutable). El cambio solo
        afecta ocurrencias futuras; los movimientos ya materializados no se modifican.
      properties:
        date: { type: string, format: date-time, description: próxima ocurrencia }
        amount: { type: number, minimum: 0 }
        frequency: { $ref: '#/components/schemas/Frequency' }
        category: { type: integer }
        subcategory: { type: integer }
        account: { type: integer }
        description: { type: string }

    ScheduledOutput:
      type: object
      required: [id, date, type, description, amount, currency, frequency, user]
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        date: { type: string, format: date-time }
        type: { $ref: '#/components/schemas/MovementType' }
        description: { type: string }
        amount: { type: number }
        currency: { type: string }
        categoryId: { type: integer }
        subcategoryId: { type: integer }
        accountId: { type: integer }
        frequency: { $ref: '#/components/schemas/Frequency' }
        user: { type: integer }

    TransferInput:
      type: object
      description: El monto y la moneda son los de la cuenta origen; el destino se calcula por tasa.
      required: [from, to, amount, currency, date]
      properties:
        from: { type: integer, minimum: 1, description: cuenta origen }
        to: { type: integer, minimum: 1, description: cuenta destino }
        amount: { type: number, minimum: 0.01 }
        currency: { type: string, description: moneda de la cuenta origen }
        date: { type: string, format: date-time }
        description: { type: string, nullable: true }

    TransferOutput:
      type: object
      required: [transferGroup, fromMovementId, toMovementId, amount, currency, toAmount, toCurrency, exchangeRate, date]
      properties:
        transferGroup: { type: string, format: uuid }
        fromMovementId: { type: integer }
        toMovementId: { type: integer }
        amount: { type: number, description: monto debitado del origen }
        currency: { type: string, description: moneda del origen }
        toAmount: { type: number, description: monto acreditado en destino (= amount * exchangeRate) }
        toCurrency: { type: string, description: moneda del destino }
        exchangeRate:
          type: number
          description: tasa aplicada origen→destino (1 si misma moneda)
        date: { type: string, format: date-time }

    TransferReversalResponse:
      type: object
      required: [originalTransferGroup, reversalTransferGroup, fromMovementId, toMovementId]
      properties:
        originalTransferGroup: { type: string, format: uuid }
        reversalTransferGroup:
          type: string
          format: uuid
          description: transferGroup del par compensatorio creado
        fromMovementId: { type: integer, description: movimiento compensatorio de la pata origen }
        toMovementId: { type: integer, description: movimiento compensatorio de la pata destino }

    MovementReversalResponse:
      type: object
      required: [externalReference, originalMovementId, reversalMovementId]
      properties:
        externalReference: { type: string }
        originalMovementId: { type: integer }
        reversalMovementId:
          type: integer
          description: id del movimiento compensatorio

    ConsolidatedAccountBalance:
      type: object
      required: [accountId, currency, balance, balanceInPresentationCurrency]
      properties:
        accountId: { type: integer }
        currency: { type: string }
        balance: { type: number, description: saldo en la moneda de la cuenta }
        balanceInPresentationCurrency:
          type: number
          description: mismo saldo convertido a la moneda de presentación

    ConsolidatedBalanceResponse:
      type: object
      required: [presentationCurrency, total, incomes, expenses, accounts]
      properties:
        presentationCurrency:
          type: string
          description: moneda de presentación del usuario (claim del JWT)
        total:
          type: number
          description: saldo consolidado de todas las cuentas en la moneda de presentación
        incomes: { type: number, description: ingresos consolidados en moneda de presentación }
        expenses: { type: number, description: gastos consolidados en moneda de presentación }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/ConsolidatedAccountBalance' }
